<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Jev routes every v0 chat · variant round</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* Locked tokens: diagram-design profile "vercel" (vercel.com/design.md + Geist brand CSS) */
      --color-paper: #ffffff;
      --color-paper-2: #fafafa;
      --color-ink: #171717;
      --color-muted: #4d4d4d;
      --color-soft: #7d7d7d;
      --color-rule: rgba(0,0,0,0.10);
      --color-rule-solid: #c9c9c9;
      --color-accent: #0070f3;
      --color-accent-tint: rgba(0,112,243,0.08);
      --color-link: #0070f3;
      --color-fill-input: rgba(77,77,77,0.10);
      --color-fill-store: rgba(23,23,23,0.05);
      --color-fill-external: rgba(23,23,23,0.03);
      --color-fill-frame: rgba(23,23,23,0.02);
      --color-stroke-external: rgba(23,23,23,0.30);
      --color-frame-stroke: rgba(23,23,23,0.22);
      --color-lifeline: rgba(23,23,23,0.20);
      --color-divider: rgba(23,23,23,0.20);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      padding: 3rem 2rem 7rem;
      display: flex;
      justify-content: center;
    }

    .round { max-width: 1200px; width: 100%; }

    .vswitch {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
    }
    .variant { display: none; }
    #v1:checked ~ .variant[data-position="1"],
    #v2:checked ~ .variant[data-position="2"],
    #v3:checked ~ .variant[data-position="3"],
    #v4:checked ~ .variant[data-position="4"] { display: block; }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 450;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    figure { overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }

    svg text { font-family: var(--font-sans); }
    .t-name { font-size: 12px; font-weight: 600; fill: var(--color-ink); }
    .t-sub { font-family: var(--font-mono); font-size: 9px; fill: var(--color-muted); }
    .t-label { font-family: var(--font-mono); font-size: 8px; fill: var(--color-muted); }
    .t-label-accent { font-family: var(--font-mono); font-size: 8px; fill: var(--color-accent); }
    .t-tab { font-family: var(--font-mono); font-size: 8px; font-weight: 500; letter-spacing: 0.12em; fill: var(--color-muted); }
    .t-zone { font-family: var(--font-mono); font-size: 8px; fill: var(--color-soft); }
    .t-note { font-size: 10px; fill: var(--color-muted); }

    .vbar {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      display: flex;
      align-items: stretch;
      gap: 4px;
      padding: 6px;
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      background: var(--color-paper);
      max-width: calc(100vw - 32px);
    }
    .vbar label {
      display: block;
      padding: 8px 14px;
      min-width: 44px;
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
    }
    .vbar label:hover { border-color: var(--color-muted); }
    .vbar .pos {
      display: block;
      font: 600 12px/1.2 var(--font-sans);
      color: var(--color-ink);
    }
    .vbar .dir {
      display: block;
      font: 400 10px/1.4 var(--font-sans);
      color: var(--color-muted);
    }
    #v1:checked ~ .vbar label[for="v1"],
    #v2:checked ~ .vbar label[for="v2"],
    #v3:checked ~ .vbar label[for="v3"],
    #v4:checked ~ .vbar label[for="v4"] {
      border-color: var(--color-accent);
      background: var(--color-accent-tint);
    }
    .vswitch:focus-visible ~ .vbar label { outline: none; }
    #v1:focus-visible ~ .vbar label[for="v1"],
    #v2:focus-visible ~ .vbar label[for="v2"],
    #v3:focus-visible ~ .vbar label[for="v3"],
    #v4:focus-visible ~ .vbar label[for="v4"] {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    .vbar .hint {
      align-self: center;
      padding: 0 10px 0 6px;
      border-left: 1px solid var(--color-rule);
      margin-left: 4px;
      font: 400 10px/1.5 var(--font-sans);
      color: var(--color-muted);
      max-width: 18ch;
    }

    @media print {
      .vbar { display: none; }
      body { padding-bottom: 3rem; }
    }
  </style>
</head>
<body>
  <main class="round">
    <input class="vswitch" type="radio" name="variant" id="v1" checked aria-label="Variant 1: runtime sequence">
    <input class="vswitch" type="radio" name="variant" id="v2" aria-label="Variant 2: policy flowchart">
    <input class="vswitch" type="radio" name="variant" id="v3" aria-label="Variant 3: model lifecycle">
    <input class="vswitch" type="radio" name="variant" id="v4" aria-label="Variant 4: system map">

    <!-- ============ POSITION 1: sequence ============ -->
    <section class="variant" data-position="1" aria-label="Variant 1 of 4">
      <h1>How Jev routes every v0 chat</h1>
      <figure>

        <path d="M424,304 H456 Q464,304 464,312 V328 Q464,336 456,336 H424" fill="none" stroke="var(--color-muted)" stroke-width="1.2" marker-end="url(#jev-flow-v1-arrow)"/>
        <line x1="424" y1="392" x2="916" y2="392" stroke="var(--color-muted)" stroke-width="1.2" marker-end="url(#jev-flow-v1-arrow)"/>
        <line x1="916" y1="448" x2="164" y2="448" stroke="var(--color-muted)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#jev-flow-v1-arrow)"/>
        <line x1="164" y1="552" x2="416" y2="552" stroke="var(--color-muted)" stroke-width="1.2" marker-end="url(#jev-flow-v1-arrow)"/>
        <line x1="424" y1="600" x2="916" y2="600" stroke="var(--color-muted)" stroke-width="1.2" marker-end="url(#jev-flow-v1-arrow)"/>
        <line x1="916" y1="648" x2="164" y2="648" stroke="var(--color-muted)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#jev-flow-v1-arrow)"/>
        <line x1="164" y1="724" x2="416" y2="724" stroke="var(--color-muted)" stroke-width="1.2" marker-end="url(#jev-flow-v1-arrow)"/>
        <line x1="424" y1="772" x2="916" y2="772" stroke="var(--color-muted)" stroke-width="1.2" marker-end="url(#jev-flow-v1-arrow)"/>

        <rect x="452" y="196" width="196" height="12" fill="var(--color-paper)"/><text x="550" y="205" class="t-label-accent" text-anchor="middle">evaluateQuestions · 3 questions · 1 call</text>
        <rect x="472" y="244" width="156" height="12" fill="var(--color-paper)"/><text x="550" y="253" class="t-label" text-anchor="middle">taskType · complexity · proceed</text>

        <rect x="594" y="372" width="152" height="12" fill="var(--color-paper)"/><text x="670" y="381" class="t-label" text-anchor="middle">createAsync · model + metadata</text>
        <rect x="460" y="428" width="160" height="12" fill="var(--color-paper)"/><text x="540" y="437" class="t-label" text-anchor="middle">SSE · decision meta → stream</text>
        <rect x="220" y="532" width="140" height="12" fill="var(--color-paper)"/><text x="290" y="541" class="t-label" text-anchor="middle">POST /:id/messages · message</text>
        <rect x="576" y="580" width="188" height="12" fill="var(--color-paper)"/><text x="670" y="589" class="t-label" text-anchor="middle">chats.get → routedModelId → sendStream</text>
        <rect x="460" y="628" width="160" height="12" fill="var(--color-paper)"/><text x="540" y="637" class="t-label" text-anchor="middle">stream · same model · warm cache</text>
        <rect x="206" y="704" width="168" height="12" fill="var(--color-paper)"/><text x="290" y="713" class="t-label" text-anchor="middle">POST /:id/messages · escalate=true</text>
        <rect x="572" y="752" width="196" height="12" fill="var(--color-paper)"/><text x="670" y="761" class="t-label" text-anchor="middle">sendStream v0-max · one cold cache write</text>

        <!-- actors -->
        <rect x="60" y="32" width="200" height="52" rx="6" fill="var(--color-paper)"/>
        <rect x="60" y="32" width="200" height="52" rx="6" fill="var(--color-fill-input)" stroke="var(--color-soft)" stroke-width="1"/>
        <text x="160" y="56" class="t-name" text-anchor="middle">Browser</text>
        <text x="160" y="72" class="t-sub" text-anchor="middle">chat-workbench.tsx</text>

        <text x="640" y="855" class="t-label">fail-safe: unavailable or confidence &lt; 0.5 → v0-pro</text>
      </svg>
      </figure>
    </section>

    <!-- ============ POSITION 2: flowchart ============ -->

        <line x1="300" y1="312" x2="300" y2="372" stroke="var(--color-muted)" stroke-width="1.2" marker-end="url(#jev-flow-v2-arrow)"/>

        <line x1="300" y1="444" x2="300" y2="504" stroke="var(--color-muted)" stroke-width="1.2" marker-end="url(#jev-flow-v2-arrow)"/>
        <path d="M172,408 H136 Q128,408 128,416 V796 Q128,804 136,804 H200" fill="none" stroke="var(--color-muted)" stroke-width="1.2" marker-end="url(#jev-flow-v2-arrow)"/>
        <line x1="428" y1="540" x2="640" y2="540" stroke="var(--color-muted)" stroke-width="1.2" marker-end="url(#jev-flow-v2-arrow)"/>
        <line x1="300" y1="576" x2="300" y2="636" stroke="var(--color-muted)" stroke-width="1.2" marker-end="url(#jev-flow-v2-arrow)"/>

        <rect x="308" y="204" width="56" height="12" fill="var(--color-paper)"/><text x="314" y="213" class="t-label">no · auto</text>

        <rect x="640" y="640" width="240" height="64" rx="6" fill="var(--color-paper)"/>
